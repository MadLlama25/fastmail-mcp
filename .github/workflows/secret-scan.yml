name: Secret & PII scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only: this workflow only inspects the checked-out tree.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files for secrets and personal information
        run: node scripts/scan-secrets.mjs --all
